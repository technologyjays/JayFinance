services:
  - type: web
    name: jayfinance
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app_jayfinance_online:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FINANCE_CHAT_MODEL
        value: openai/gpt-oss-20b
